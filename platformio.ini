; MeshChat - LoRa ESP32 OS
; Firmware modes:
;   *_meshtastic  – LoRa / BLE parameters match the Meshtastic mesh network
;                   (sync word 0x2B, SF11, BW250 kHz, Meshtastic BLE GATT API)
;   *_bitchat     – BLE uses the Nordic UART Service (NUS) as used by BitChat;
;                   LoRa uses MeshChat custom parameters (SF10, BW125 kHz)
;
; Legacy environments (no suffix) kept as BitChat mode for backwards
; compatibility.
;
; Supported boards: Heltec WiFi LoRa 32 V3/V2 and LILYGO T-Deck
; https://github.com/JeremyLakeyJr/meshchat

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    h2zero/NimBLE-Arduino @ ^1.4.2
    arduino-libraries/Arduino_CRC32 @ ^1.0.0

; ----------------------------------------------------------------
; Shared LoRa pin / board configurations (extended by mode envs)
; ----------------------------------------------------------------

[board_heltec_v3]
board = heltec_wifi_lora_32_V3
platform = espressif32
build_flags =
    -DBOARD_HELTEC_V3
    -DHAS_OLED
    -DLORA_FREQ=915E6
    -DLORA_SCK=9
    -DLORA_MISO=11
    -DLORA_MOSI=10
    -DLORA_SS=8
    -DLORA_RST=12
    -DLORA_DIO0=14
    -DOLED_SDA=17
    -DOLED_SCL=18
    -DOLED_RST=21
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ ^2.5.9

[board_heltec_v2]
board = heltec_wifi_lora_32_V2
platform = espressif32
build_flags =
    -DBOARD_HELTEC_V2
    -DHAS_OLED
    -DLORA_FREQ=915E6
    -DLORA_SCK=5
    -DLORA_MISO=19
    -DLORA_MOSI=27
    -DLORA_SS=18
    -DLORA_RST=14
    -DLORA_DIO0=26
    -DOLED_SDA=4
    -DOLED_SCL=15
    -DOLED_RST=16
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ ^2.5.9

[board_tdeck]
board = esp32s3box
platform = espressif32
build_flags =
    -DBOARD_TDECK
    -DHAS_TFT
    -DHAS_KEYBOARD
    -DLORA_FREQ=915E6
    -DLORA_SCK=40
    -DLORA_MISO=38
    -DLORA_MOSI=41
    -DLORA_SS=9
    -DLORA_RST=17
    -DLORA_DIO0=45
    -DTFT_CS=12
    -DTFT_DC=11
    -DTFT_RST=10
    -DTFT_BL=42
    -DKEYBOARD_SDA=18
    -DKEYBOARD_SCL=8
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43

; ================================================================
; Heltec WiFi LoRa 32 V3
; ================================================================

; -- Meshtastic mode ---------------------------------------------
; LoRa: SF11, BW250, CR5, sync 0x2B, 17 dBm (LongFast channel)
; BLE:  Meshtastic GATT service (ToRadio / FromRadio / FromNum)
[env:heltec_wifi_lora_32_V3_meshtastic]
board    = ${board_heltec_v3.board}
platform = ${board_heltec_v3.platform}
build_flags =
    ${board_heltec_v3.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_MESHTASTIC
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v3.lib_deps}

; -- BitChat mode ------------------------------------------------
; LoRa: SF10, BW125, CR5, sync 0x12, 14 dBm
; BLE:  Nordic UART Service (NUS) as used by BitChat
[env:heltec_wifi_lora_32_V3_bitchat]
board    = ${board_heltec_v3.board}
platform = ${board_heltec_v3.platform}
build_flags =
    ${board_heltec_v3.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v3.lib_deps}

; -- Legacy default (BitChat mode, backwards-compatible name) ----
[env:heltec_wifi_lora_32_V3]
board    = ${board_heltec_v3.board}
platform = ${board_heltec_v3.platform}
build_flags =
    ${board_heltec_v3.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v3.lib_deps}

; ================================================================
; Heltec WiFi LoRa 32 V2
; ================================================================

; -- Meshtastic mode ---------------------------------------------
[env:heltec_wifi_lora_32_V2_meshtastic]
board    = ${board_heltec_v2.board}
platform = ${board_heltec_v2.platform}
build_flags =
    ${board_heltec_v2.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_MESHTASTIC
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v2.lib_deps}

; -- BitChat mode ------------------------------------------------
[env:heltec_wifi_lora_32_V2_bitchat]
board    = ${board_heltec_v2.board}
platform = ${board_heltec_v2.platform}
build_flags =
    ${board_heltec_v2.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v2.lib_deps}

; -- Legacy default ----------------------------------------------
[env:heltec_wifi_lora_32_V2]
board    = ${board_heltec_v2.board}
platform = ${board_heltec_v2.platform}
build_flags =
    ${board_heltec_v2.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-Heltec"'
lib_deps = ${board_heltec_v2.lib_deps}

; ================================================================
; LILYGO T-Deck
; ================================================================

; -- Meshtastic mode ---------------------------------------------
[env:lilygo_tdeck_meshtastic]
board    = ${board_tdeck.board}
platform = ${board_tdeck.platform}
build_flags =
    ${board_tdeck.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_MESHTASTIC
    -DDEVICE_NAME='"MeshChat-TDeck"'
lib_deps = ${board_tdeck.lib_deps}

; -- BitChat mode ------------------------------------------------
[env:lilygo_tdeck_bitchat]
board    = ${board_tdeck.board}
platform = ${board_tdeck.platform}
build_flags =
    ${board_tdeck.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-TDeck"'
lib_deps = ${board_tdeck.lib_deps}

; -- Legacy default ----------------------------------------------
[env:lilygo_tdeck]
board    = ${board_tdeck.board}
platform = ${board_tdeck.platform}
build_flags =
    ${board_tdeck.build_flags}
    -DFIRMWARE_MODE=FIRMWARE_MODE_BITCHAT
    -DDEVICE_NAME='"MeshChat-TDeck"'
lib_deps = ${board_tdeck.lib_deps}
